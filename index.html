<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>E-Learning | SDN 8 BANAWA</title>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css">
    
    <style>
        #login-page { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 2000; background: #f4f6f9; display: flex; align-items: center; justify-content: center; }
        .login-container { display: flex; width: 950px; max-width: 95%; background: #fff; border-radius: 20px; overflow: hidden; box-shadow: 0 20px 40px rgba(0,0,0,0.15); }
        .login-brand { background: linear-gradient(135deg, #1a365d 0%, #2b6cb0 100%); color: white; width: 45%; padding: 40px; text-align: center; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .login-form-area { width: 55%; padding: 50px; }
        .materi-card { transition: 0.3s; border: none !important; border-radius: 15px !important; cursor: pointer; height: 100%; }
        .materi-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.1) !important; }
        #global-loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.9); z-index: 9999; display: flex; justify-content: center; align-items: center; }
        .img-kolosal { max-width: 100%; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); cursor: zoom-in; }
        @media (max-width: 768px) { .login-container { flex-direction: column; } .login-brand, .login-form-area { width: 100%; } }
    </style>
</head>
<body class="hold-transition layout-top-nav">

<div id="login-page" style="display: none;">
    <div class="login-container">
        <div class="login-brand">
            <img src="https://upload.wikimedia.org/wikipedia/commons/e/eb/Logo-Tut-Wuri-Handayani-PNG-Warna.png" width="80" class="mb-3">
            <h3>E-LEARNING</h3>
            <p>SDN 8 BANAWA</p>
        </div>
        <div class="login-form-area">
            <h4 class="font-weight-bold mb-4">Masuk Siswa</h4>
            <input type="text" id="user_nama" class="form-control mb-3" placeholder="Nama Lengkap">
            <select id="user_kelas" class="form-control mb-4">
                <option value="" disabled selected>Pilih Kelas...</option>
                <option>I (Satu)</option><option>II (Dua)</option><option>III (Tiga)</option>
                <option>IV (Empat)</option><option>V (Lima)</option><option>VI (Enam)</option>
            </select>
            <button class="btn btn-primary btn-block" onclick="simpanIdentitas()">MULAI BELAJAR</button>
        </div>
    </div>
</div>

<div class="wrapper">
    <div id="global-loader" class="d-none"><div class="spinner-border text-primary"></div></div>

    <nav class="main-header navbar navbar-expand-md navbar-light bg-white shadow-sm sticky-top">
        <div class="container">
            <span class="navbar-brand font-weight-bold text-primary">SDN 8 BANAWA</span>
            <div class="ml-auto">
                <span class="badge badge-info p-2 mr-2"><i class="fas fa-user mr-1"></i> <span id="display-nama"></span></span>
                <button class="btn btn-xs btn-danger" onclick="logout()"><i class="fas fa-power-off"></i></button>
            </div>
        </div>
    </nav>

    <div class="content-wrapper">
        <div class="content-header text-center py-4 bg-white shadow-sm mb-4">
            <div class="container">
                <h2 class="font-weight-bold">Materi Belajar</h2>
                <input type="text" id="search-materi" class="form-control w-50 mx-auto mt-3 rounded-pill" placeholder="Cari judul materi..." onkeyup="filterMateri()">
            </div>
        </div>

        <div class="content">
            <div class="container">
                <div id="view-grid" class="row"></div>
                
                <div id="view-content" class="d-none">
                    <div class="card card-primary card-outline shadow-lg">
                        <div class="card-header">
                            <h3 class="card-title font-weight-bold" id="main-title"></h3>
                            <div class="card-tools"><button class="btn btn-tool text-danger" onclick="backToGrid()"><i class="fas fa-times fa-lg"></i></button></div>
                        </div>
                        <div class="card-body" id="doc-content"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzFEDVca7A5ZtSRopz8jpUQCYdXT16Xxzr1qCSVxxntce0-UYXmcqJ_aodkoq39Fv2E6f/exec";
    let allMateri = [];

    $(document).ready(function() {
        if (!localStorage.getItem('siswa_nama')) { $('#login-page').show(); } 
        else { updateUserDisplay(); fetchMenu(); }
    });

    function simpanIdentitas() {
        const n = $('#user_nama').val();
        const k = $('#user_kelas').val();
        if(n && k) {
            localStorage.setItem('siswa_nama', n);
            localStorage.setItem('siswa_kelas', k);
            updateUserDisplay();
            $('#login-page').fadeOut();
            fetchMenu();
        } else { alert("Isi data!"); }
    }

    function updateUserDisplay() {
        $('#display-nama').text(localStorage.getItem('siswa_nama') + " (" + localStorage.getItem('siswa_kelas') + ")");
    }

    async function fetchMenu() {
        $('#global-loader').removeClass('d-none');
        try {
            const r = await fetch(SCRIPT_URL);
            const d = await r.json();
            allMateri = d.menu || [];
            renderCards(allMateri);
        } finally { $('#global-loader').addClass('d-none'); }
    }

    function renderCards(list) {
        const grid = $('#view-grid').empty();
        list.forEach(m => {
            let icon = "fa-file-word text-primary";
            if(m.type === 'pdf') icon = "fa-file-pdf text-danger";
            if(m.type === 'ppt') icon = "fa-file-powerpoint text-orange";
            if(m.type === 'image') icon = "fa-file-image text-success";

            grid.append(`
                <div class="col-md-4 mb-4">
                    <div class="card materi-card shadow-sm text-center p-4" onclick="openMateri('${m.id}', '${m.name}')">
                        <i class="fas ${icon} fa-4x mb-3"></i>
                        <h6 class="font-weight-bold">${m.name}</h6>
                    </div>
                </div>
            `);
        });
    }

    function filterMateri() {
        const k = $('#search-materi').val().toLowerCase();
        renderCards(allMateri.filter(m => m.name.toLowerCase().includes(k)));
    }

    async function openMateri(id, judul) {
        $('#global-loader').removeClass('d-none');
        const n = localStorage.getItem('siswa_nama'), k = localStorage.getItem('siswa_kelas');
        fetch(`${SCRIPT_URL}?action=log&nama=${encodeURIComponent(n)}&kelas=${encodeURIComponent(k)}&judul=${encodeURIComponent(judul)}&id=${id}`);

        try {
            const r = await fetch(`${SCRIPT_URL}?id=${id}`);
            const d = await r.json();
            $('#view-grid').addClass('d-none');
            $('#view-content').removeClass('d-none');
            $('#main-title').text(judul);
            
            const area = $('#doc-content');
            if(d.type === 'image') {
                area.html(`<div class="text-center"><img src="${d.content}" class="img-kolosal" onclick="window.open(this.src)"></div>`);
            } else if(d.type === 'doc') {
                area.html(d.content);
            } else {
                area.html(`<iframe src="${d.content}" style="width:100%; height:750px; border:none;"></iframe>`);
            }
            window.scrollTo(0,0);
        } finally { $('#global-loader').addClass('d-none'); }
    }

    function backToGrid() { $('#view-content').addClass('d-none'); $('#view-grid').removeClass('d-none'); }
    function logout() { localStorage.clear(); location.reload(); }
</script>
</body>
</html>
